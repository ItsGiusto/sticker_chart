<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c5ce7">
<title>Sticker Chart</title>
<style>
  :root { --bg:#fff8e7; --card:#fff; --ink:#2d2a4a; --muted:#7a7794; --good:#00b894; --warn:#e17055; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px 6px; max-width:560px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0; }
  #status { font-size:.8rem; color:var(--muted); }
  #status.err { color:var(--warn); font-weight:600; }
  main { max-width:560px; margin:0 auto; padding:8px 12px 24px; display:grid; gap:14px; }
  .card { background:var(--card); border-radius:20px; padding:16px; box-shadow:0 4px 14px rgba(45,42,74,.1); border-top:8px solid var(--c); position:relative; overflow:hidden; }
  .card h2 { margin:0 0 10px; font-size:1.1rem; line-height:1.3; }
  .stickers { min-height:44px; display:flex; flex-wrap:wrap; gap:4px; font-size:1.7rem; margin-bottom:10px; }
  .stickers .empty { font-size:.9rem; color:var(--muted); align-self:center; }
  .stickers span.new { animation:pop .35s ease-out; }
  @keyframes pop { from { transform:scale(0) rotate(-40deg); } to { transform:scale(1) rotate(0); } }
  .bar { height:16px; background:#eee; border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; background:var(--c); border-radius:99px; transition:width .4s; }
  .meta { display:flex; justify-content:space-between; align-items:center; margin:8px 0 12px; font-size:.9rem; color:var(--muted); }
  .goal { display:flex; align-items:center; gap:6px; }
  .goal button { width:28px; height:28px; border-radius:50%; border:1px solid #ddd; background:#fff; font-size:1rem; line-height:1; }
  .add { width:100%; padding:16px; font-size:1.2rem; font-weight:700; color:#fff; background:var(--c); border:0; border-radius:14px; }
  .add:active { transform:scale(.97); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .small { flex:1; padding:8px; border:1px solid #ddd; background:#fff; border-radius:10px; font-size:.85rem; color:var(--muted); }
  .done { background:linear-gradient(135deg,#ffeaa7,#fab1a0); border-radius:14px; padding:14px; text-align:center; font-weight:700; margin-bottom:10px; animation:pop .5s ease-out; }
  .done button { margin-top:8px; padding:10px 18px; border:0; border-radius:10px; background:var(--good); color:#fff; font-weight:700; font-size:1rem; }
  .rounds { font-size:.8rem; color:var(--muted); margin-top:6px; }
  footer { max-width:560px; margin:0 auto; padding:0 12px 28px; display:flex; gap:8px; flex-wrap:wrap; }
  footer button { flex:1; padding:10px; border:1px solid #ddd; background:#fff; border-radius:10px; font-size:.85rem; color:var(--muted); }
  .msg { background:#fff; border-radius:16px; padding:16px; font-size:.9rem; line-height:1.5; }
  .confetti { position:absolute; top:-20px; font-size:1.4rem; animation:fall 1.8s linear forwards; pointer-events:none; }
  @keyframes fall { to { transform:translateY(420px) rotate(360deg); opacity:0; } }
</style>
</head>
<body>
<header><h1>⭐ Sticker Chart</h1><div id="status">connecting…</div></header>
<main id="app"></main>
<footer>
  <button id="copyLink">Copy share link</button>
  <button id="exportBtn">Export backup</button>
  <button id="importBtn">Import backup</button>
  <input id="importFile" type="file" accept="application/json" hidden>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, child, onValue, runTransaction, set } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5peRMl1-arPeWUfbETbxXTYIYpJOgiLU",
  authDomain: "sticker-chart-6c0fa.firebaseapp.com",
  databaseURL: "https://sticker-chart-6c0fa-default-rtdb.firebaseio.com",
  projectId: "sticker-chart-6c0fa",
  storageBucket: "sticker-chart-6c0fa.firebasestorage.app",
  messagingSenderId: "329929065742",
  appId: "1:329929065742:web:1013f4c59c19a3b832035f"
};

/* The key is the path your data lives under. It is NOT stored in this file, so
   it stays out of the public repo. It comes from the link's #hash, is
   remembered on the device, and is generated on the very first visit.
   Treat the full link like a password: anyone with it can edit the chart. */
function getKey() {
  const fromHash = location.hash.replace("#", "").trim();
  let key = fromHash;
  try { if (!key) key = localStorage.getItem("sc_key") || ""; } catch (e) {}
  if (key.length < 20) {
    const bytes = crypto.getRandomValues(new Uint8Array(12));
    key = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
  }
  try { localStorage.setItem("sc_key", key); } catch (e) {}
  if (fromHash !== key) history.replaceState(null, "", "#" + key);
  return key;
}
const CHART_KEY = getKey();

const STICKERS = ["⭐","🌟","💫","✨","🌈","🦄","🎈","🍭"];
const COLORS = ["#6c5ce7","#00b894","#e17055","#0984e3","#fd79a8"];
const DEFAULTS = {
  listen: { order:0, name:"Listening the first time", count:0, goal:10, rounds:0 },
  calm:   { order:1, name:"Being calm when something might upset you", count:0, goal:10, rounds:0 },
  try:    { order:2, name:"Trying something that is new or seems hard", count:0, goal:10, rounds:0 }
};

const $ = id => document.getElementById(id);
const statusEl = $("status");
const setStatus = (m, err) => { statusEl.textContent = m; statusEl.className = err ? "err" : ""; };

const db = getDatabase(initializeApp(firebaseConfig));
const catsRef = ref(db, "charts/" + CHART_KEY + "/categories");

let cats = null;
const prevCounts = {};
const celebrated = new Set();

/* Atomic update of one category, so two phones tapping at once both count. */
function update(id, fn) {
  runTransaction(child(catsRef, id), cur => {
    if (cur === null) return cur;
    fn(cur);
    return cur;
  }).catch(() => setStatus("couldn't save, try again", true));
}

onValue(ref(db, ".info/connected"), s => {
  if (s.val() === true) setStatus("live");
  else setStatus("offline, changes will sync when back", true);
});

onValue(catsRef, snap => {
  const v = snap.val();
  if (!v) {
    // First run: create the three starting categories (only if still empty).
    runTransaction(catsRef, cur => cur === null ? DEFAULTS : cur)
      .catch(() => showMsg("Could not reach the database. Check that the database rules were published, then reload."));
    return;
  }
  cats = v;
  render();
}, err => {
  showMsg("Could not read the database (" + err.code + "). Check the database rules, then reload.");
  setStatus("can't reach database", true);
});

function showMsg(t) { const d = document.createElement("div"); d.className = "msg"; d.textContent = t; $("app").replaceChildren(d); }

function render() {
  const app = $("app");
  app.innerHTML = "";
  Object.entries(cats).sort((a, b) => (a[1].order || 0) - (b[1].order || 0)).forEach(([id, c], i) => {
    const color = COLORS[i % COLORS.length];
    const emoji = STICKERS[(c.rounds || 0) % STICKERS.length];
    const count = c.count || 0, goal = Math.max(1, c.goal || 10);
    const reached = count >= goal;
    const pct = Math.min(100, Math.round(count / goal * 100));
    const prev = prevCounts[id] ?? count;
    prevCounts[id] = count;

    const card = document.createElement("section");
    card.className = "card"; card.style.setProperty("--c", color);

    const h = document.createElement("h2"); h.textContent = c.name; card.appendChild(h);

    const row = document.createElement("div"); row.className = "stickers";
    if (count === 0) { const e = document.createElement("span"); e.className = "empty"; e.textContent = "No stickers yet"; row.appendChild(e); }
    for (let k = 0; k < count; k++) {
      const s = document.createElement("span"); s.textContent = emoji;
      if (k >= prev) s.className = "new";
      row.appendChild(s);
    }
    card.appendChild(row);

    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("div"); fill.style.width = pct + "%"; bar.appendChild(fill);
    card.appendChild(bar);

    const meta = document.createElement("div"); meta.className = "meta";
    const cnt = document.createElement("span"); cnt.textContent = count + " of " + goal;
    const gl = document.createElement("span"); gl.className = "goal";
    const lbl = document.createElement("span"); lbl.textContent = "goal";
    const minus = document.createElement("button"); minus.textContent = "−"; minus.setAttribute("aria-label", "Lower goal");
    const plus = document.createElement("button"); plus.textContent = "+"; plus.setAttribute("aria-label", "Raise goal");
    minus.onclick = () => update(id, x => { x.goal = Math.max(1, (x.goal || 10) - 1); });
    plus.onclick = () => update(id, x => { x.goal = Math.min(50, (x.goal || 10) + 1); });
    gl.append(lbl, minus, plus);
    meta.append(cnt, gl); card.appendChild(meta);

    if (reached) {
      const d = document.createElement("div"); d.className = "done";
      d.textContent = "🎉 Goal reached! Time to celebrate! 🎉";
      const b = document.createElement("button"); b.textContent = "Start a new chart";
      b.onclick = () => update(id, x => { x.count = 0; x.rounds = (x.rounds || 0) + 1; });
      d.appendChild(document.createElement("br")); d.appendChild(b);
      card.appendChild(d);
      if (!celebrated.has(id)) { celebrated.add(id); burst(card); }
    } else celebrated.delete(id);

    const add = document.createElement("button"); add.className = "add"; add.textContent = emoji + "  Add Sticker";
    add.onclick = () => update(id, x => { x.count = (x.count || 0) + 1; });
    card.appendChild(add);

    const r2 = document.createElement("div"); r2.className = "row";
    const undo = document.createElement("button"); undo.className = "small"; undo.textContent = "Undo last";
    undo.onclick = () => update(id, x => { x.count = Math.max(0, (x.count || 0) - 1); });
    r2.appendChild(undo); card.appendChild(r2);

    if (c.rounds) { const rd = document.createElement("div"); rd.className = "rounds"; rd.textContent = "Charts completed: " + c.rounds; card.appendChild(rd); }
    app.appendChild(card);
  });
}

function burst(card) {
  for (let n = 0; n < 18; n++) {
    const s = document.createElement("span"); s.className = "confetti";
    s.textContent = ["🎉","⭐","✨","🎈"][n % 4];
    s.style.left = Math.random() * 95 + "%"; s.style.animationDelay = Math.random() * .6 + "s";
    card.appendChild(s); setTimeout(() => s.remove(), 2600);
  }
}

$("copyLink").onclick = async () => {
  const url = location.href.split("#")[0] + "#" + CHART_KEY;
  try { await navigator.clipboard.writeText(url); setStatus("link copied"); }
  catch (e) { prompt("Copy this link:", url); }
};
$("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(cats, null, 2)], { type:"application/json" }));
  a.download = "sticker-chart-backup.json"; a.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (typeof data !== "object" || !Object.values(data).every(c => typeof c.name === "string")) throw new Error("bad");
    if (confirm("Replace current stickers with this backup?")) await set(catsRef, data);
  } catch (err) { setStatus("invalid backup file", true); }
  e.target.value = "";
};
</script>
</body>
</html>
